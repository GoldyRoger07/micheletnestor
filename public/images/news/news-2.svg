      <stop offset="0" stop-color="#172740"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c9a14a" stop-opacity="0.45"/>
