# Aperçu du site sur GitHub Pages : https://goldyroger07.github.io/micheletnestor/
# Seules les pages pré-rendues sont publiées (pas de serveur Node) : le formulaire de contact
# (POST /api/contact) ne fonctionne donc pas sur cet aperçu.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:gh-pages

      # 404.html : GitHub Pages le sert pour toute URL inconnue → l'application affiche sa page 404.
      # .nojekyll : publie les fichiers tels quels, sans traitement Jekyll.
      - name: Préparer le dossier publié
        run: |
          cp dist/micheletnestor/browser/index.csr.html dist/micheletnestor/browser/404.html
          touch dist/micheletnestor/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/micheletnestor/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
